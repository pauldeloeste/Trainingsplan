<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Tracker</title>
<style>
  :root{
    --bg:#12141a;
    --panel:#1a1d25;
    --panel-2:#20232c;
    --line:#2a2e38;
    --text:#eceef2;
    --text-dim:#9a9fab;
    --accent:#5fb88a;
    --accent-dim:#5fb88a33;
    --pull:#5fb88a;
    --push:#c98a4b;
    --extra:#7a8bd8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px;
    max-width:640px;
    margin:0 auto;
    line-height:1.4;
  }
  header{margin-bottom:18px;}
  header h1{font-size:1.3rem;margin:0 0 2px;letter-spacing:.2px;}
  header p{margin:0;color:var(--text-dim);font-size:.85rem;}

  .weekbar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:14px;
  }
  .weekbar button.arrow{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    width:34px;height:34px;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
  }
  .weekbar select{
    flex:1;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    font-size:.95rem;
  }
  .weekbar .jump{
    background:var(--accent-dim);
    border:1px solid var(--accent);
    color:var(--accent);
    border-radius:10px;
    padding:8px 10px;
    font-size:.8rem;
    white-space:nowrap;
    cursor:pointer;
  }

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text-dim);
    font-size:.85rem;
    cursor:pointer;
  }
  .tab.active{color:var(--text);border-color:currentColor;}
  .tab[data-day="A"].active{color:var(--pull);}
  .tab[data-day="B"].active{color:var(--push);}
  .tab[data-day="C"].active{color:var(--extra);}

  .day-panel{display:none;}
  .day-panel.active{display:block;}
  .day-note{
    color:var(--text-dim);
    font-size:.85rem;
    margin:0 0 14px;
  }
  .optional-tag{
    display:inline-block;
    font-size:.7rem;
    color:var(--extra);
    border:1px solid var(--extra);
    border-radius:6px;
    padding:1px 6px;
    margin-left:6px;
  }

  .exercise{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .exercise-head h3{margin:0;font-size:.98rem;}
  .exercise-head .target{color:var(--text-dim);font-size:.8rem;margin-top:2px;}
  .star{color:#e0b84a;margin-right:4px;}

  table.sets{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:.85rem;
  }
  table.sets th{
    text-align:left;
    color:var(--text-dim);
    font-weight:400;
    font-size:.72rem;
    padding-bottom:6px;
  }
  table.sets td{padding:3px 3px;}
  table.sets input[type=text],table.sets input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:6px 6px;
    font-size:.85rem;
  }
  table.sets input[type=checkbox]{width:18px;height:18px;}

  textarea.notes{
    width:100%;
    margin-top:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:8px 10px;
    font-size:.85rem;
    min-height:44px;
    resize:vertical;
    font-family:inherit;
  }
  .notes-label{font-size:.72rem;color:var(--text-dim);margin-top:8px;display:block;}
  .carry-hint{font-size:.7rem;color:var(--accent);margin-top:2px;display:block;}

  .handstand-block{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin:10px 0 16px;
    font-size:.85rem;
    color:var(--text-dim);
  }

  footer{margin-top:10px;}
  .save-btn{
    width:100%;
    background:var(--accent);
    color:#0d1410;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
  }
  .save-status{
    text-align:center;
    color:var(--accent);
    font-size:.8rem;
    margin-top:8px;
    min-height:1.1em;
  }

  .progress-panel{display:none;}
  .progress-panel.active{display:block;}
  .metric{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .metric h4{margin:0 0 6px;font-size:.85rem;color:var(--text-dim);font-weight:500;}
  .metric .rows{font-size:.85rem;}
  .metric .rows div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--line);}
  .metric .rows div:last-child{border-bottom:none;}
</style>
</head>
<body>

<header>
  <h1>Training Tracker</h1>
  <p>Calisthenics &amp; Kraft Progress Tracker</p>
</header>

<div class="weekbar">
  <button class="arrow" id="prevWeek">←</button>
  <select id="weekSelect"></select>
  <button class="arrow" id="nextWeek">→</button>
  <button class="jump" id="jumpCurrent">Aktuelle Woche</button>
</div>

<div class="tabs">
  <div class="tab active" data-day="A">Einheit A · Zug</div>
  <div class="tab" data-day="B">Einheit B · Push</div>
  <div class="tab" data-day="C">Einheit C</div>
  <div class="tab" data-day="progress">📈</div>
</div>

<div id="dayA" class="day-panel active"></div>
<div id="dayB" class="day-panel"></div>
<div id="dayC" class="day-panel"></div>
<div id="progressPanel" class="progress-panel"></div>

<script>
// ---------- Plan definition ----------
const PLAN = {
  A: {
    label: "Zug + Rücken (Breite &amp; Dicke)",
    note: "Klimmzüge als Hauptübung. Ziel: mehr Gesamt-Wiederholungen als letzte Woche. Der Rest der Einheit deckt bewusst Lat (Breite) und Rückenmitte/Rhomboiden (Dicke) getrennt ab, damit die Rückenmitte nicht zu kurz kommt.",
    exercises: [
      { id:"kl", name:"Klimmzüge", main:true, target:"4–5 Sätze · Mehr Gesamt-WDH als letzte Woche", cols:["Gewicht / Var.","Wdh."], sets:5 },
      { id:"ru_breit", name:"Langhantel-/Kabelrudern (breiter Griff)", target:"3 × 10–12 · Schulterblätter bewusst zusammenziehen", cols:["Gewicht","Wdh."], sets:3 },
      { id:"sap", name:"Straight-Arm Pulldown", target:"3 × 12–15 · Lat-Isolation, Arme fast gestreckt", cols:["Gewicht","Wdh."], sets:3 },
      { id:"csr", name:"Chest-Supported Row / T-Bar-Rudern", target:"3 × 10–15 · Fokus Rückenmitte/Rhomboiden", cols:["Gewicht","Wdh."], sets:3 },
      { id:"fp", name:"Face Pulls", target:"3 × 15–20 · Schultergesundheit", cols:["Gewicht","Wdh."], sets:3 },
      { id:"hlr", name:"Hanging Leg Raises / Knieheben", target:"3 × 10–15", cols:["Var.","Wdh."], sets:3 },
    ]
  },
  B: {
    label: "Push + Beine + Handstand",
    note: "Drücken, Beine für Körper-Balance, und 10–15 Min. dediziertes Handstand-Training am Ende.",
    exercises: [
      { id:"bd", name:"Bankdrücken / Liegestütze (progressiv)", target:"3 × 6–10", cols:["Gewicht","Wdh."], sets:3 },
      { id:"sd", name:"Schulterdrücken (LH oder KH)", target:"3 × 8–12", cols:["Gewicht","Wdh."], sets:3 },
      { id:"ssw", name:"Split Squat Walk mit Kurzhanteln", target:"3 × 10–12 pro Bein", cols:["Gewicht","Wdh."], sets:3 },
      { id:"rdl", name:"Rumänisches Kreuzheben", target:"3 × 10–12", cols:["Gewicht","Wdh."], sets:3 },
      { id:"dips", name:"Dips (Maschine oder frei)", target:"3 × 6–10", cols:["Gewicht/Var.","Wdh."], sets:3 },
      { id:"sh", name:"Seitheben", target:"3 × 12–15", cols:["Gewicht","Wdh."], sets:3 },
      { id:"hs", name:"Handstand-Progression", target:"3–5 Versuche · von Wand lösen · Schulter aktiv drücken", cols:["Protokoll","Sek./Wdh."], sets:3,
        setLabels:["Wall Handstand Hold","Versuche gesamt (von Wand gelöst)","Bester freier Hold"] },
    ]
  },
  C: {
    label: "Extra-Volumen / Schwachstellen",
    optional: true,
    note: "Optional — nur wenn der dritte Tag in der Woche machbar ist. Füllt Bizeps-Isolation, zusätzliches Rückenvolumen (anderer Griff) und mehr Beinarbeit.",
    exercises: [
      { id:"curl", name:"Bizeps-Curls", target:"3 × 10–12", cols:["Gewicht","Wdh."], sets:3 },
      { id:"ru_eng", name:"Kabelrudern (enger/neutraler Griff)", target:"3 × 10–15 · anderer Winkel als Einheit A", cols:["Gewicht","Wdh."], sets:3 },
      { id:"kb", name:"Kniebeugen oder Beinpresse", target:"3 × 8–12", cols:["Gewicht","Wdh."], sets:3 },
      { id:"tri", name:"Trizeps-Isolation (Kickback/Pushdown)", target:"3 × 12–15", cols:["Gewicht","Wdh."], sets:3 },
      { id:"plank", name:"Plank", target:"3 × 30–60 Sekunden", cols:["Var.","Sek."], sets:3 },
    ]
  }
};

const KEY_METRICS = [
  { day:"A", ex:"kl",  label:"Klimmzüge – Gesamt-WDH pro Woche", mode:"sumreps" },
  { day:"A", ex:"sap", label:"Straight-Arm Pulldown – Bestes Gewicht", mode:"maxweight" },
  { day:"B", ex:"bd",  label:"Bankdrücken – Bestes Gewicht", mode:"maxweight" },
  { day:"B", ex:"hs",  label:"Handstand – Bester freier Hold (Sek.)", mode:"lastset" },
];

// ---------- Storage ----------
const STORE_KEY = "trainingsplan-data";
let DATA = { weeks:{}, currentWeek:1 };
let activeWeek = 1;
let activeDay = "A";
let saveTimer = null;

function emptyExercise(ex){
  return { sets: Array.from({length: ex.sets}, ()=>({v1:"",v2:""})), notes:"" };
}
function emptyDay(dayKey){
  const day = {};
  PLAN[dayKey].exercises.forEach(ex => { day[ex.id] = emptyExercise(ex); });
  return day;
}
function ensureWeek(n){
  if(!DATA.weeks[n]){
    const week = { A: emptyDay("A"), B: emptyDay("B"), C: emptyDay("C") };
    DATA.weeks[n] = week;
    if(n > DATA.currentWeek) DATA.currentWeek = n;
  }
  return DATA.weeks[n];
}

// Findet die aktuellste eigene Notiz für eine Übung: eigene Woche zuerst,
// sonst rückwärts durch die Wochen bis eine gefunden wird.
function getEffectiveNote(dayKey, exId, week){
  for(let w = week; w >= 1; w--){
    const wk = DATA.weeks[w];
    if(wk && wk[dayKey] && wk[dayKey][exId] && wk[dayKey][exId].notes){
      return { text: wk[dayKey][exId].notes, own: (w === week) };
    }
  }
  return { text:"", own:true };
}

async function loadData(){
  try{
    const raw = window.localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.weeks) DATA = parsed;
    }
  }catch(e){ /* kein gespeicherter Stand vorhanden */ }
  if(!DATA.weeks[1]) ensureWeek(1);
  activeWeek = DATA.currentWeek || 1;
}

async function persist(showStatus){
  try{
    window.localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    if(showStatus) flashSaved();
  }catch(e){
    if(showStatus) flashSaved("Speichern fehlgeschlagen");
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>persist(false), 400);
}
function flashSaved(msg){
  const el = document.getElementById("saveStatus_"+activeDay);
  if(!el) return;
  el.textContent = msg || "✓ Gespeichert";
  setTimeout(()=>{ if(el) el.textContent = ""; }, 1800);
}

// ---------- Rendering ----------
function renderWeekSelect(){
  const sel = document.getElementById("weekSelect");
  sel.innerHTML = "";
  const maxWeek = Math.max(DATA.currentWeek, activeWeek);
  for(let i=1;i<=maxWeek+1;i++){
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = (i === maxWeek+1) ? `Woche ${i} (neu)` : `Woche ${i}`;
    if(i === activeWeek) opt.selected = true;
    sel.appendChild(opt);
  }
}

function renderDay(dayKey){
  const container = document.getElementById("day"+dayKey);
  const plan = PLAN[dayKey];
  const weekData = ensureWeek(activeWeek)[dayKey];
  const prevWeek = DATA.weeks[activeWeek-1];
  const prevDayData = prevWeek ? prevWeek[dayKey] : null;
  let html = "";
  html += `<p class="day-note"><strong>${dayKey}</strong> · ${plan.label}${plan.optional?'<span class="optional-tag">optional</span>':''}<br>${plan.note}</p>`;

  plan.exercises.forEach((ex, idx) => {
    const exData = weekData[ex.id];
    const isHandstand = ex.id === "hs";
    html += `<div class="exercise">
      <div class="exercise-head">
        <div>
          <h3>${ex.main?'<span class="star">⭐</span>':''}${idx+1}. ${ex.name}</h3>
          <div class="target">${ex.target}</div>
        </div>
      </div>
      ${prevDayData && prevDayData[ex.id] && prevDayData[ex.id].sets.some(s=>s.v1||s.v2) ? '<span class="carry-hint">Werte der Vorwoche stehen als Platzhalter in den leeren Feldern</span>' : ''}`;

    const prevExData = prevDayData ? prevDayData[ex.id] : null;

    if(isHandstand){
      html += `<div class="handstand-block">🤸 10–15 Minuten dediziertes Handstand-Training</div>`;
      html += `<table class="sets"><tr><th>Protokoll</th><th>Wert</th></tr>`;
      ex.setLabels.forEach((label, sIdx)=>{
        const s = exData.sets[sIdx] || {v1:"",v2:""};
        const prevS = prevExData ? prevExData.sets[sIdx] : null;
        const ph = (prevS && prevS.v2) ? `Vorwoche: ${prevS.v2}` : "";
        html += `<tr><td>${label}</td><td><input type="text" placeholder="${ph}" data-day="${dayKey}" data-ex="${ex.id}" data-set="${sIdx}" data-field="v2" value="${s.v2||""}"></td></tr>`;
      });
      html += `</table>`;
    } else {
      html += `<table class="sets"><tr><th>Satz</th><th>${ex.cols[0]}</th><th>${ex.cols[1]}</th></tr>`;
      exData.sets.forEach((s, sIdx)=>{
        const prevS = prevExData ? prevExData.sets[sIdx] : null;
        const ph1 = (prevS && prevS.v1) ? `Vorwoche: ${prevS.v1}` : "";
        const ph2 = (prevS && prevS.v2) ? `Vorwoche: ${prevS.v2}` : "";
        html += `<tr>
          <td>${sIdx+1}</td>
          <td><input type="text" inputmode="decimal" placeholder="${ph1}" data-day="${dayKey}" data-ex="${ex.id}" data-set="${sIdx}" data-field="v1" value="${s.v1||""}"></td>
          <td><input type="text" inputmode="numeric" placeholder="${ph2}" data-day="${dayKey}" data-ex="${ex.id}" data-set="${sIdx}" data-field="v2" value="${s.v2||""}"></td>
        </tr>`;
      });
      html += `</table>`;
    }

    const effectiveNote = getEffectiveNote(dayKey, ex.id, activeWeek);
    html += `<span class="notes-label">Notiz</span>
      <textarea class="notes" data-day="${dayKey}" data-ex="${ex.id}" placeholder="z.B. Griffweite, Gefühl, nächstes Mal steigern...">${effectiveNote.text}</textarea>`;
    if(!effectiveNote.own && effectiveNote.text){
      html += `<span class="carry-hint">↩ aus Vorwoche übernommen</span>`;
    }
    html += `</div>`;
  });

  html += `<footer>
    <button class="save-btn" data-day="${dayKey}">💾 Einheit speichern</button>
    <div class="save-status" id="saveStatus_${dayKey}"></div>
  </footer>`;

  container.innerHTML = html;

  container.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input", onFieldChange);
  });
  container.querySelectorAll("textarea.notes").forEach(ta=>{
    ta.addEventListener("input", onNoteChange);
  });
  container.querySelector(".save-btn").addEventListener("click", ()=>{
    persist(true);
  });
}

function onFieldChange(e){
  const { day, ex, set, field } = e.target.dataset;
  const weekData = ensureWeek(activeWeek)[day];
  weekData[ex].sets[set][field] = e.target.value;
  scheduleSave();
}
function onNoteChange(e){
  const { day, ex } = e.target.dataset;
  const weekData = ensureWeek(activeWeek)[day];
  weekData[ex].notes = e.target.value;
  scheduleSave();
}

function renderProgress(){
  const el = document.getElementById("progressPanel");
  const weekNums = Object.keys(DATA.weeks).map(Number).sort((a,b)=>a-b);
  let html = "";
  KEY_METRICS.forEach(metric=>{
    html += `<div class="metric"><h4>${metric.label}</h4><div class="rows">`;
    weekNums.forEach(w=>{
      const exData = DATA.weeks[w][metric.day][metric.ex];
      let value = "–";
      if(metric.mode === "sumreps"){
        const sum = exData.sets.reduce((acc,s)=>acc + (parseFloat(s.v2)||0), 0);
        if(sum>0) value = sum;
      } else if(metric.mode === "maxweight"){
        const vals = exData.sets.map(s=>parseFloat(s.v1)).filter(v=>!isNaN(v));
        if(vals.length) value = Math.max(...vals);
      } else if(metric.mode === "lastset"){
        const last = exData.sets[exData.sets.length-1];
        if(last && last.v2) value = last.v2;
      }
      html += `<div><span>Woche ${w}</span><span>${value}</span></div>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html || "<p class='day-note'>Noch keine Daten.</p>";
}

function renderAll(){
  renderWeekSelect();
  renderDay("A");
  renderDay("B");
  renderDay("C");
  renderProgress();
}

// ---------- Navigation ----------
function setActiveWeek(n){
  if(n < 1) n = 1;
  activeWeek = n;
  ensureWeek(activeWeek);
  renderAll();
  scheduleSave();
}
function setActiveDay(day){
  activeDay = day;
  document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.day===day));
  document.querySelectorAll(".day-panel").forEach(p=> p.classList.remove("active"));
  document.getElementById("progressPanel").classList.remove("active");
  if(day === "progress"){
    document.getElementById("progressPanel").classList.add("active");
    renderProgress();
  } else {
    document.getElementById("day"+day).classList.add("active");
  }
}

document.getElementById("prevWeek").addEventListener("click", ()=> setActiveWeek(activeWeek-1));
document.getElementById("nextWeek").addEventListener("click", ()=> setActiveWeek(activeWeek+1));
document.getElementById("weekSelect").addEventListener("change", (e)=> setActiveWeek(parseInt(e.target.value,10)));
document.getElementById("jumpCurrent").addEventListener("click", ()=> setActiveWeek(DATA.currentWeek));
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=> setActiveDay(tab.dataset.day));
});

// ---------- Init ----------
(async function init(){
  await loadData();
  renderAll();
  setActiveDay("A");
})();
</script>
</body>
</html>
